name: CI

# Pull requests: test and build the image (no push).
# Push to master: test, work out the next semver from the conventional commits,
# push the image to GHCR and create the GitHub release. A `fix:` is a patch, a
# `feat:` a minor and a `feat!:` / BREAKING CHANGE a major bump. Commits like
# `chore:` or `docs:` don't create a release but still refresh the `latest` image.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on master half-way through a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamevote
          POSTGRES_PASSWORD: gamevote
          POSTGRES_DB: gamevote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gamevote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: gamevote-api-go
    env:
      DATABASE_URL: postgres://gamevote:gamevote@localhost:5432/gamevote?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gamevote-api-go/go.mod
          cache-dependency-path: gamevote-api-go/go.sum
      - run: go vet ./...
      - run: go test ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamevote-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run build-only

  # Works out the next version without creating anything yet, so a failed image
  # build doesn't leave a tag behind.
  version:
    needs: [api, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: false
          tag_prefix: v

  docker:
    needs: [api, ui, version]
    # `version` is skipped on pull requests, which must still build the image.
    if: ${{ !cancelled() && needs.api.result == 'success' && needs.ui.result == 'success' && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}},value=${{ needs.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.new_tag }}
      # Only log in and push outside of pull requests.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # PR runs get a read-only cache token, so only export the cache elsewhere.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  # Creates the tag and the GitHub release once the image is safely pushed.
  release:
    needs: [version, docker]
    if: needs.version.outputs.new_tag != '' && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ needs.version.outputs.new_tag }}"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "${{ needs.version.outputs.new_tag }}"
          --generate-notes
