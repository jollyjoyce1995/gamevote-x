name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  # Called by release.yml, because tags pushed with GITHUB_TOKEN don't trigger push events.
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamevote
          POSTGRES_PASSWORD: gamevote
          POSTGRES_DB: gamevote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gamevote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: gamevote-api-go
    env:
      DATABASE_URL: postgres://gamevote:gamevote@localhost:5432/gamevote?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gamevote-api-go/go.mod
          cache-dependency-path: gamevote-api-go/go.sum
      - run: go vet ./...
      - run: go test ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamevote-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run build-only

  docker:
    needs: [api, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
      # Only log in and push from the main repo, never for PRs.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
